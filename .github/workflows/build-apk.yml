name: Build Android APK and Backup Source
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle assembleDebug
      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -p "$APK" classes.dex > /tmp/classes.dex
          test -s /tmp/classes.dex
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep -q "package: name='com.mineload.app'"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
          sha256sum "$APK"
      - name: Run Android lint
        run: gradle lintDebug
      - name: Create source backup
        run: zip -r MineLoad-source-backup.zip . -x '.git/*' 'MineLoad-source-backup.zip'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MineLoad-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload full project backup
        uses: actions/upload-artifact@v4
        with:
          name: MineLoad-source-backup
          path: MineLoad-source-backup.zip
