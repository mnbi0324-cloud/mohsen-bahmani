
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          test -n "$ZIP_FILE"
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          test -f extracted/MineLoadAndroid/app/src/main/java/com/mineload/app/MainActivity.kt

      - name: Fix Kotlin plugin and JVM targets
        run: |
          cd extracted/MineLoadAndroid
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.mineload.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.mineload.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '1.1'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

      - name: Build APK
        run: |
          cd extracted/MineLoadAndroid
          gradle assembleDebug

      - name: Verify APK and launcher class
        run: |
          APK=extracted/MineLoadAndroid/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          DEX=$(unzip -p "$APK" classes.dex)
          test ${#DEX} -gt 4000
          unzip -p "$APK" classes.dex | strings | grep -q 'MainActivity'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MineLoad-debug-apk
          path: extracted/MineLoadAndroid/app/build/outputs/apk/debug/app-debug.apk
